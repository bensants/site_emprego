services:
  # ============================================================================
  # Banco de Dados MongoDB Local (opcional, pode ser substituído por MongoDB Atlas)
  # ============================================================================
  mongo:
    image: mongo:7-jammy
    container_name: obidos-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: obidos-connect
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - obidos-network

  # ============================================================================
  # API Backend Node.js / Express
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: obidos-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/obidos-connect}
      JWT_SECRET: ${JWT_SECRET:-obidos_secret_token_jwt_producao_2026}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - obidos-network

  # ============================================================================
  # Frontend Web React Vite servido via Nginx Alpine
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: obidos-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - obidos-network

networks:
  obidos-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
